<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Jungle – Sistema de Anamnese</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--surface:#161a22;--surface2:#1e2330;--border:#2a3040;--accent:#e8c14a;--accent2:#4ae8b0;--danger:#e84a4a;--text:#e8eaf0;--text-muted:#7a8299;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--surface);border-bottom:2px solid var(--accent);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;letter-spacing:2px;color:var(--accent)}
.logo span{color:var(--text)}
.logo-sub{font-size:12px;font-weight:400;color:var(--text-muted);margin-left:8px;letter-spacing:1px}
.header-right{display:flex;gap:8px;align-items:center}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite;margin-right:4px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-info{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:4px}
.btn{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;padding:8px 18px;border:none;border-radius:6px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#0d0f14}.btn-primary:hover{background:#f0cc58;transform:translateY(-1px)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#f05c5c}
.btn-sm{font-size:12px;padding:5px 12px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.tabs{display:flex;border-bottom:2px solid var(--border);background:var(--surface)}
.tab{flex:1;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;padding:11px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;text-transform:uppercase;transition:all .15s;position:relative}
.tab:hover{color:var(--text)}.tab.active{color:var(--accent)}
.tab.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--accent)}
.tab-badge{background:var(--danger);color:#fff;font-size:10px;padding:1px 5px;border-radius:10px;margin-left:4px;vertical-align:middle}
.app{display:flex;flex:1;height:calc(100vh - 100px)}
aside{width:280px;min-width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:14px;border-bottom:1px solid var(--border)}
.sidebar-header h3{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase}
.search-box{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 11px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;outline:none;transition:border-color .15s;margin-bottom:8px}
.search-box:focus{border-color:var(--accent)}
.professor-filter{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.prof-chip{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;transition:all .15s;text-transform:uppercase}
.prof-chip:hover{border-color:var(--accent);color:var(--accent)}.prof-chip.active{background:var(--accent);color:#0d0f14;border-color:var(--accent)}
.month-filter{display:flex;align-items:center;gap:6px}
.month-filter label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;white-space:nowrap}
.month-select{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:12px;padding:5px 8px;outline:none;transition:border-color .15s}
.month-select:focus{border-color:var(--accent)}
.btn-clear-month{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;transition:all .15s}
.btn-clear-month:hover{border-color:var(--danger);color:var(--danger)}
.student-list{flex:1;overflow-y:auto;padding:6px}
.student-list::-webkit-scrollbar{width:4px}.student-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.student-card{padding:10px 12px;border-radius:var(--radius);margin-bottom:5px;cursor:pointer;border:1px solid transparent;transition:all .15s;background:var(--surface2)}
.student-card:hover{border-color:var(--border)}.student-card.active{border-color:var(--accent);background:rgba(232,193,74,0.07)}
.student-card .sname{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.student-card .smeta{font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center}
.badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:20px;text-transform:uppercase}
.badge-done{background:rgba(74,232,176,0.15);color:var(--accent2);border:1px solid rgba(74,232,176,0.3)}
.badge-pending{background:rgba(232,193,74,0.12);color:var(--accent);border:1px solid rgba(232,193,74,0.25)}
.empty-list{text-align:center;padding:30px 16px;color:var(--text-muted);font-size:13px}
.stats-bar{display:flex;gap:10px;padding:8px 14px;background:var(--surface2);border-top:1px solid var(--border);flex-wrap:wrap}
.stat{font-size:11px;color:var(--text-muted)}.stat strong{color:var(--text);font-weight:600}
main{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
main::-webkit-scrollbar{width:6px}.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;opacity:.5}
.welcome-icon{font-size:56px;margin-bottom:14px}
.welcome h2{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;margin-bottom:6px}
.welcome p{font-size:14px;color:var(--text-muted)}
.form-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.form-title{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;letter-spacing:1px;line-height:1}
.form-title small{display:block;font-family:'Barlow',sans-serif;font-size:12px;font-weight:400;letter-spacing:0;color:var(--text-muted);margin-top:4px}
.treino-done-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:20px;transition:all .2s;cursor:pointer}
.treino-done-bar:hover{border-color:var(--accent2)}.treino-done-bar.done{border-color:var(--accent2);background:rgba(74,232,176,0.07)}
.checkbox-big{width:26px;height:26px;border-radius:6px;border:2px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:all .15s}
.checkbox-big.checked{background:var(--accent2);border-color:var(--accent2);color:#0d0f14;font-weight:bold}
.treino-label{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px}
.treino-done-bar.done .treino-label{color:var(--accent2)}
.treino-date{font-size:11px;color:var(--text-muted);margin-left:auto}
.section-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:14px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.form-row{display:flex;gap:12px;flex-wrap:wrap}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.form-group.full{flex:0 0 100%}
label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
input[type="text"],input[type="date"],select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:8px 11px;outline:none;transition:border-color .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:70px}
.idade-display{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 11px;font-size:13px;color:var(--accent)}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:7px}
.check-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;transition:all .12s;user-select:none}
.check-item:hover{border-color:var(--accent)}.check-item.selected{border-color:var(--accent);background:rgba(232,193,74,0.08)}
.check-box{width:17px;height:17px;border:2px solid var(--border);border-radius:4px;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;transition:all .12s}
.check-item.selected .check-box{background:var(--accent);border-color:var(--accent);color:#0d0f14}
.check-item span{font-size:13px}
.radio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:7px}
.radio-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;transition:all .12s;user-select:none}
.radio-item:hover{border-color:var(--accent)}.radio-item.selected{border-color:var(--accent);background:rgba(232,193,74,0.08)}
.radio-dot{width:17px;height:17px;border:2px solid var(--border);border-radius:50%;background:var(--bg);flex-shrink:0;position:relative;transition:all .12s}
.radio-item.selected .radio-dot{border-color:var(--accent)}
.radio-item.selected .radio-dot::after{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:var(--accent);top:50%;left:50%;transform:translate(-50%,-50%)}
.radio-item span{font-size:13px}
.save-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;margin:0 -24px -24px}
.save-status{font-size:12px;color:var(--text-muted)}.save-status.saved{color:var(--accent2)}.save-status.saving{color:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:var(--radius);padding:26px;width:90%;max-width:480px;transform:translateY(20px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal h2{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;margin-bottom:18px}
.modal-group{margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--accent);color:var(--accent);font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;padding:11px 18px;border-radius:var(--radius);z-index:300;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.loading{display:flex;align-items:center;justify-content:center;padding:30px;color:var(--text-muted);font-size:13px;gap:8px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* RECADOS */
.recados-area{display:flex;flex-direction:column;height:calc(100vh - 100px)}
.recados-filter{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.recados-filter label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase}
.recados-filter select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:12px;padding:5px 9px;outline:none}
.recados-list{flex:1;overflow-y:auto;padding:10px}
.recado-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.recado-card.nao-lido{border-color:var(--accent);background:rgba(232,193,74,0.05)}
.recado-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;flex-wrap:wrap;gap:6px}
.recado-remetente{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--accent)}
.recado-destinatario{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text-muted)}
.recado-data{font-size:11px;color:var(--text-muted)}
.recado-aluno{font-size:12px;color:var(--accent2);margin-bottom:5px}
.recado-texto{font-size:13px;color:var(--text);line-height:1.5}
.recado-footer{display:flex;justify-content:flex-end;margin-top:8px;gap:6px}
.btn-lido{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;padding:4px 11px;border-radius:6px;border:1px solid var(--accent2);background:transparent;color:var(--accent2);cursor:pointer;transition:all .15s}
.btn-lido:hover{background:var(--accent2);color:#0d0f14}
.btn-del-recado{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;padding:4px 11px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;transition:all .15s}
.btn-del-recado:hover{border-color:var(--danger);color:var(--danger)}
.novo-recado-bar{padding:14px;border-top:1px solid var(--border);background:var(--surface)}
.novo-recado-bar h4{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
.novo-recado-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.novo-recado-row select,.novo-recado-row input{flex:1;min-width:110px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:12px;padding:6px 9px;outline:none;transition:border-color .15s}
.novo-recado-row select:focus,.novo-recado-row input:focus{border-color:var(--accent)}
.novo-recado-texto{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:12px;padding:7px 9px;outline:none;resize:none;transition:border-color .15s;margin-bottom:7px}
.novo-recado-texto:focus{border-color:var(--accent)}
/* LINKS */
.links-panel{padding:22px;overflow-y:auto;height:calc(100vh - 100px);background:var(--bg)}
.novo-link-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.novo-link-form h3{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
.link-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:9px}
.link-card.pendente{border-left:3px solid var(--accent)}.link-card.preenchido{border-left:3px solid var(--accent2)}.link-card.importado{border-left:3px solid var(--text-muted);opacity:.7}
.link-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px;flex-wrap:wrap;gap:7px}
.link-card-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700}
.link-card-meta{font-size:11px;color:var(--text-muted)}
.link-url{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:11px;color:var(--text-muted);word-break:break-all;margin-bottom:9px}
.link-actions{display:flex;gap:7px;flex-wrap:wrap}
.btn-copy{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;padding:5px 12px;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;transition:all .15s}
.btn-copy:hover{background:var(--accent);color:#0d0f14}
.btn-import{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;padding:5px 12px;border-radius:6px;border:1px solid var(--accent2);background:transparent;color:var(--accent2);cursor:pointer;transition:all .15s}
.btn-import:hover{background:var(--accent2);color:#0d0f14}
.btn-del-link{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;transition:all .15s}
.btn-del-link:hover{border-color:var(--danger);color:var(--danger)}
.status-badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 9px;border-radius:20px;text-transform:uppercase}
.status-pendente{background:rgba(232,193,74,0.12);color:var(--accent);border:1px solid rgba(232,193,74,0.3)}
.status-preenchido{background:rgba(74,232,176,0.12);color:var(--accent2);border:1px solid rgba(74,232,176,0.3)}
.status-importado{background:rgba(122,130,153,0.12);color:var(--text-muted);border:1px solid rgba(122,130,153,0.3)}
@media(max-width:700px){.app{flex-direction:column;height:auto}aside{width:100%;min-width:0;max-height:280px}}
/* LOGIN */
.login-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
.login-box{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:var(--radius);padding:40px 36px;width:90%;max-width:380px;text-align:center}
.login-logo{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;color:var(--accent);letter-spacing:3px;margin-bottom:4px}
.login-logo span{color:var(--text)}
.login-sub{font-size:13px;color:var(--text-muted);margin-bottom:28px}
.login-box .form-group{text-align:left;margin-bottom:14px}
.login-box label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:5px}
.login-box input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;padding:10px 13px;outline:none;transition:border-color .15s}
.login-box input:focus{border-color:var(--accent)}
.login-btn{width:100%;background:var(--accent);color:#0d0f14;font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;letter-spacing:2px;padding:12px;border:none;border-radius:6px;cursor:pointer;margin-top:6px;transition:all .15s}
.login-btn:hover{background:#f0cc58}
.login-error{color:var(--danger);font-size:13px;margin-top:10px;display:none}
/* DASHBOARD */
.dash-panel{padding:24px;overflow-y:auto;height:calc(100vh - 100px);background:var(--bg)}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:24px}
.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.dash-card h3{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.metric-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(42,48,64,0.5)}
.metric-row:last-child{border-bottom:none}
.metric-label{font-size:14px;color:var(--text)}
.metric-value{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--accent)}
.metric-value.green{color:var(--accent2)}.metric-value.red{color:var(--danger)}
.bar-wrap{flex:1;margin:0 12px;background:var(--surface2);border-radius:4px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .4s}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:36px;font-weight:900;color:var(--accent);line-height:1}
.kpi-lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.dash-select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:6px 10px;outline:none;margin-left:8px}
.obj-tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:12px;padding:3px 10px;margin:3px;color:var(--text-muted)}

.pending-filter label{font-size:12px;color:var(--text-muted);cursor:pointer;user-select:none}
.pending-cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
</style>

<script>
const SB = 'https://pxsjhcsptmsoyubmvuwp.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4c2poY3NwdG1zb3l1Ym12dXdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODgyMjUsImV4cCI6MjEwMzc2NDIyNX0.5cYQj1GoVacOqK8Y8N6s8F8r0vpML_l3XqRCN5T8W7c';
const FORM_URL = 'https://ironjungleacademia.github.io/anamnese-aluno/';

const H = {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};

async function sb(path,opts={}){
  const r=await fetch(SB+'/rest/v1/'+path,{...opts,headers:{...H,'Prefer':opts.prefer||'',...(opts.headers||{})}});
  const t=await r.text();return t?JSON.parse(t):null;
}

// Convert Supabase row (lowercase) to app object (camelCase)
function rowToApp(r){
  if(!r)return null;
  return {
    id:r.id,nome:r.nome,professor:r.professor,
    dataNasc:r.datanasc||'',altura:r.altura||'',peso:r.peso||'',telefone:r.telefone||'',
    objetivo:r.objetivo||[],objetivoOutro:r.objetivooutro||'',
    jaTreinou:r.jatreinou||'',tempoPratica:r.tempopratica||'',tempoSemTreinar:r.temposemtreinar||'',
    vezesSemanais:r.vezessemanais||'',tempoPorTreino:r.tempoporTreino||'',outroEsporte:r.outroesporte||'',
    rotina:r.rotina||'',saude:r.saude||[],saudeOutro:r.saudeoutro||'',
    dores:r.dores||[],doresObs:r.doresobs||'',lesoes:r.lesoes||'',cirurgias:r.cirurgias||'',
    fraturas:r.fraturas||'',medicamentos:r.medicamentos||'',sintomas:r.sintomas||[],
    obs:r.obs||'',dataAssinatura:r.dataassinatura||'',
    treinoPronto:r.treinopronto||false,treinoProntoData:r.treinoprontodata||null,
    cadastro:r.cadastro||''
  };
}

function appToRow(a){
  const row = {
    nome:a.nome,professor:a.professor,datanasc:a.dataNasc||'',altura:a.altura||'',peso:a.peso||'',
    telefone:a.telefone||'',objetivo:a.objetivo||[],objetivooutro:a.objetivoOutro||'',
    jatreinou:a.jaTreinou||'',tempopratica:a.tempoPratica||'',temposemtreinar:a.tempoSemTreinar||'',
    vezessemanais:a.vezesSemanais||'',tempoporTreino:a.tempoPorTreino||'',outroesporte:a.outroEsporte||'',
    rotina:a.rotina||'',saude:a.saude||[],saudeoutro:a.saudeOutro||'',
    dores:a.dores||[],doresobs:a.doresObs||'',lesoes:a.lesoes||'',cirurgias:a.cirurgias||'',
    fraturas:a.fraturas||'',medicamentos:a.medicamentos||'',sintomas:a.sintomas||[],
    obs:a.obs||'',dataassinatura:a.dataAssinatura||'',
    treinopronto:a.treinoPronto||false,treinoprontodata:a.treinoProntoData||null,
    cadastro:a.cadastro||new Date().toLocaleDateString('pt-BR')
  };
  if(a.id) row.id = a.id;
  return row;
}

let students=[], currentId=null, filterProf='Todos', saveTimer=null;

async function fetchAll(){
  const rows=await sb('alunos?select=*&order=nome.asc')||[];
  students=rows.map(rowToApp);
  renderList();
}

function toast(msg,color){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.borderColor=color||'var(--accent)';t.style.color=color||'var(--accent)';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

function setProf(chip){
  document.querySelectorAll('.prof-chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');filterProf=chip.dataset.prof;renderList();
}

function clearMonth(){filterMonth='';const s=document.getElementById('monthFilter');if(s)s.value='';renderList();}
let filterMonth='';

function populateMonthFilter(){
  const sel=document.getElementById('monthFilter');if(!sel)return;
  const cur=sel.value;const months=new Set();
  students.forEach(s=>{if(s.cadastro){const p=s.cadastro.split('/');if(p.length===3)months.add(p[1]+'/'+p[2]);}});
  const sorted=[...months].sort((a,b)=>{const[ma,ya]=a.split('/');const[mb,yb]=b.split('/');return(ya-yb)||(ma-mb);});
  const mn=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  sel.innerHTML='<option value="">Todos os meses</option>'+sorted.map(m=>{const[mo,yr]=m.split('/');return`<option value="${m}"${cur===m?' selected':''}>${mn[parseInt(mo)]} ${yr}</option>`;}).join('');
}

function renderList(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const sel=document.getElementById('monthFilter');filterMonth=sel?sel.value:'';
  const list=document.getElementById('studentList'),stats=document.getElementById('statsBar');
  populateMonthFilter();
  const onlyPend=document.getElementById('onlyPending')&&document.getElementById('onlyPending').checked;
  let filtered=students.filter(s=>{
    const mS=s.nome.toLowerCase().includes(q);
    const mP=filterProf==='Todos'||s.professor===filterProf;
    let mM=true;
    if(filterMonth&&s.cadastro){const p=s.cadastro.split('/');if(p.length===3)mM=(p[1]+'/'+p[2])===filterMonth;}
    const mPend=!onlyPend||!s.treinoPronto;
    return mS&&mP&&mM&&mPend;
  });
  filtered.sort((a,b)=>{if(a.treinoPronto!==b.treinoPronto)return a.treinoPronto?1:-1;return a.nome.localeCompare(b.nome);});
  const done=filtered.filter(s=>s.treinoPronto).length;
  stats.innerHTML=`<span class="stat">Total: <strong>${filtered.length}</strong></span><span class="stat">Feitos: <strong style="color:var(--accent2)">${done}</strong></span><span class="stat">Pendentes: <strong style="color:var(--accent)">${filtered.length-done}</strong></span>`;
  if(filtered.length===0){list.innerHTML='<div class="empty-list">Nenhum aluno encontrado.</div>';return;}
  list.innerHTML=filtered.map(s=>`
    <div class="student-card${s.id===currentId?' active':''}" onclick="openStudent('${s.id}')">
      <div class="sname">${s.nome}</div>
      <div class="smeta"><span>${s.professor}</span>
        <span class="badge ${s.treinoPronto?'badge-done':'badge-pending'}">${s.treinoPronto?'✓ Feito':'Pendente'}</span>
      </div>
    </div>`).join('');
}

function openNewModal(){document.getElementById('newModal').classList.add('open');setTimeout(()=>document.getElementById('newName').focus(),100);}
function closeNewModal(){document.getElementById('newModal').classList.remove('open');['newName','newDob'].forEach(id=>document.getElementById(id).value='');document.getElementById('newProf').value='';}

async function createStudent(){
  const nome=document.getElementById('newName').value.trim();
  const professor=document.getElementById('newProf').value;
  const dataNasc=document.getElementById('newDob').value;
  if(!nome||!professor){toast('⚠ Preencha nome e professor!','var(--danger)');return;}
  const btn=document.getElementById('btnCreate');btn.disabled=true;btn.textContent='Criando...';
  const novoId=Date.now().toString();
  const aluno={id:novoId,nome,professor,dataNasc,objetivo:[],saude:[],dores:[],sintomas:[],treinoPronto:false,cadastro:new Date().toLocaleDateString('pt-BR')};
  const row=appToRow(aluno);
  const res=await sb('alunos',{method:'POST',prefer:'return=representation',body:JSON.stringify(row)});
  if(res&&res[0]){
    const newA=rowToApp(res[0]);
    students.push(newA);
    renderList();closeNewModal();openStudent(newA.id);
    toast('✓ Aluno cadastrado!');
  }
  btn.disabled=false;btn.textContent='Criar & Preencher Anamnese';
}

function openStudent(id){
  currentId=id;renderList();
  const s=students.find(x=>x.id===id);if(!s)return;
  document.getElementById('mainArea').innerHTML=buildForm(s);
}

function calcIdade(d){if(!d)return'';const h=new Date(),n=new Date(d);let i=h.getFullYear()-n.getFullYear();const m=h.getMonth()-n.getMonth();if(m<0||(m===0&&h.getDate()<n.getDate()))i--;return i+' anos';}

function buildForm(s){
  return`
  <div class="form-header">
    <div class="form-title">${s.nome}<small>Prof. ${s.professor} &nbsp;•&nbsp; Cadastro: ${s.cadastro}</small></div>
    <button class="btn btn-danger btn-sm" onclick="deleteStudent('${s.id}')">🗑 Excluir</button>
  </div>
  <div class="treino-done-bar${s.treinoPronto?' done':''}" id="treinoDoneBar" onclick="toggleTreino('${s.id}')">
    <div class="checkbox-big${s.treinoPronto?' checked':''}" id="treinoDoneBox">${s.treinoPronto?'✓':''}</div>
    <span class="treino-label" id="treinoDoneLbl">${s.treinoPronto?'TREINO FEITO':'MARCAR TREINO COMO FEITO'}</span>

    <div class="form-row">
      <div class="form-group"><label>Data de Nascimento</label>

      <div class="form-group"><label>Idade</label><div class="idade-display" id="idadeDisp">${s.dataNasc?calcIdade(s.dataNasc):'Preencha a data'}</div></div>
      <div class="form-group"><label>Altura (m)</label><input type="text" placeholder="1.75" value="${s.altura||''}" onchange="fieldChange('altura',this.value)"></div>
      <div class="form-group"><label>Peso (kg)</label><input type="text" placeholder="70" value="${s.peso||''}" onchange="fieldChange('peso',this.value)"></div>
      <div class="form-group"><label>Telefone</label><input type="text" placeholder="(00) 00000-0000" value="${s.telefone||''}" onchange="fieldChange('telefone',this.value)"></div>
      <div class="form-group"><label>Professor</label>
        <select onchange="fieldChange('professor',this.value)">
          ${['Miguel','Marcello','Luppi','Daniel','Matheus'].map(p=>`<option${s.professor===p?' selected':''}>${p}</option>`).join('')}
        </select></div>
    </div>
  </div>
  <div class="section-block">
    <div class="section-title">Objetivo Principal</div>
    <div class="check-grid" id="grp-objetivo">
      ${['Hipertrofia','Emagrecimento','Condicionamento físico','Reabilitação','Saúde e qualidade de vida','Ganho de força'].map(v=>chk('objetivo',v,s.objetivo||[])).join('')}

      <input type="text" placeholder="Descreva..." value="${s.objetivoOutro||''}" onchange="fieldChange('objetivoOutro',this.value)"></div>
  </div>
  <div class="section-block">
    <div class="section-title">Histórico de Treinamento</div>

      <div class="radio-grid" id="grp-jaTreinou" style="grid-template-columns:1fr 1fr;max-width:280px">
        ${['Sim','Não'].map(v=>rad('jaTreinou',v,s.jaTreinou)).join('')}
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Há quanto tempo pratica?</label><input type="text" placeholder="Ex: 2 anos" value="${s.tempoPratica||''}" onchange="fieldChange('tempoPratica',this.value)"></div>
      <div class="form-group"><label>Tempo sem treinar?</label><input type="text" placeholder="Ex: 6 meses" value="${s.tempoSemTreinar||''}" onchange="fieldChange('tempoSemTreinar',this.value)"></div>
    </div>
    <div class="form-row" style="margin-top:10px">
      <div class="form-group"><label>Vezes por semana</label><input type="text" placeholder="Ex: 4x" value="${s.vezesSemanais||''}" onchange="fieldChange('vezesSemanais',this.value)"></div>
      <div class="form-group"><label>Tempo por treino</label><input type="text" placeholder="Ex: 1 hora" value="${s.tempoPorTreino||''}" onchange="fieldChange('tempoPorTreino',this.value)"></div>
      <div class="form-group full"><label>Já praticou outro esporte?</label><input type="text" placeholder="Descreva..." value="${s.outroEsporte||''}" onchange="fieldChange('outroEsporte',this.value)"></div>
    </div>
  </div>
  <div class="section-block">
    <div class="section-title">Rotina de Trabalho</div>
    <div class="radio-grid" id="grp-rotina">
      ${['Predominantemente sentado','Predominantemente em pé','Braçal / fisicamente ativo','Misto'].map(v=>rad('rotina',v,s.rotina)).join('')}
    </div>
  </div>
  <div class="section-block">
    <div class="section-title">Saúde e Condições Clínicas</div>

      ${['Hipertensão','Hipotensão','Diabetes','Colesterol alto','Problemas respiratórios','Osteopenia/Osteoporose','Hérnia de disco','Problemas cardíacos','Convulsões/Epilepsia'].map(v=>chk('saude',v,s.saude||[])).join('')}

  <div class="section-block">
    <div class="section-title">Dor Articular e Limitações</div>

function chk(field,label,arr){
  const sel=(arr||[]).includes(label)?'selected':'';
  return`<div class="check-item${sel?' selected':''}" data-field="${field}" data-val="${label}" onclick="clickCheck(this)"><div class="check-box">${sel?'✓':''}</div><span>${label}</span></div>`;
}
function rad(field,label,selected){
  const sel=selected===label?'selected':'';
  return`<div class="radio-item${sel?' selected':''}" data-field="${field}" data-val="${label}" onclick="clickRadio(this)"><div class="radio-dot"></div><span>${label}</span></div>`;
}
function clickRadio(el){
  const f=el.dataset.field;
  document.querySelectorAll(`.radio-item[data-field="${f}"]`).forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');mutate(f,el.dataset.val);
}
function clickCheck(el){
  el.classList.toggle('selected');
  const sel=el.classList.contains('selected');
  el.querySelector('.check-box').textContent=sel?'✓':'';
  const f=el.dataset.field,v=el.dataset.val;
  const s=students.find(x=>x.id===currentId);if(!s)return;
  if(!s[f])s[f]=[];
  if(sel){if(!s[f].includes(v))s[f].push(v);}else{s[f]=s[f].filter(x=>x!==v);}
  scheduleSave();
}
function fieldChange(field,value){mutate(field,value);}
function mutate(field,value){
  const s=students.find(x=>x.id===currentId);if(s){s[field]=value;scheduleSave();}
}
function scheduleSave(){
  const st=document.getElementById('saveStatus');
  if(st){st.textContent='● Salvando...';st.className='save-status saving';}
  clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,1200);
}
async function saveNow(){
  if(!currentId)return;
  const s=students.find(x=>x.id===currentId);if(!s)return;
  await sb(`alunos?id=eq.${currentId}`,{method:'PATCH',prefer:'return=minimal',body:JSON.stringify(appToRow(s))});
  renderList();
  const st=document.getElementById('saveStatus');
  if(st){st.textContent='✓ Salvo na nuvem';st.className='save-status saved';}
}

async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const combined=u+':'+p;
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(combined));
  const hash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  const VALID='9f37b63428c7259ed1ed31b236f65a9cce3cd45fad0017755b2c9ab5d5d99c0d';
  if(hash===VALID){
    sessionStorage.setItem('ij_auth','1');
    document.getElementById('loginOverlay').style.display='none';
    fetchAll();
  } else {
    document.getElementById('loginError').style.display='block';
    document.getElementById('loginPass').value='';
    document.getElementById('loginUser').focus();
  }
}
function checkAuth(){
  if(!sessionStorage.getItem('ij_auth')){
    document.getElementById('loginOverlay').style.display='flex';
  } else {
    document.getElementById('loginOverlay').style.display='none';
    fetchAll();
  }
}

function getMesesDisponiveis(){
  const mn=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const meses=new Set();
  students.forEach(s=>{if(s.cadastro){const p=s.cadastro.split('/');if(p.length===3)meses.add(p[1]+'/'+p[2]);}});
  return [...meses].sort((a,b)=>{const[ma,ya]=a.split('/');const[mb,yb]=b.split('/');return(yb-ya)||(mb-ma);})
    .map(m=>{const[mo,yr]=m.split('/');const mn2=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];return{value:m,label:mn2[parseInt(mo)]+' '+yr};});
}

function renderDash(){
  const c=document.getElementById('dashContent');
  if(!c||!students.length)return;
  const profs=['Miguel','Marcello','Luppi','Daniel','Matheus'];
  const mn=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const hoje=new Date();
  const mesAtualVal=String(hoje.getMonth()+1).padStart(2,'0')+'/'+hoje.getFullYear();

  const mesesDisp=getMesesDisponiveis();

  // Filtra alunos pelo mês selecionado (ou todos)
  const base=selMes
    ? students.filter(s=>{if(!s.cadastro)return false;const p=s.cadastro.split('/');return p.length===3&&(p[1]+'/'+p[2])===selMes;})
    : students;

  const total=base.length;
  const feitos=base.filter(s=>s.treinoPronto).length;
  const pend=total-feitos;
  const doMes=students.filter(s=>{if(!s.cadastro)return false;const p=s.cadastro.split('/');return p.length===3&&(p[1]+'/'+p[2])===mesAtualVal;}).length;

  const profData=profs.map(p=>{
    const all=base.filter(s=>s.professor===p);
    const done=all.filter(s=>s.treinoPronto).length;
    return{prof:p,total:all.length,done,pend:all.length-done};
  });
  const maxTotal=Math.max(...profData.map(p=>p.total),1);

  const objCount={};
  base.forEach(s=>{(s.objetivo||[]).forEach(o=>{objCount[o]=(objCount[o]||0)+1;});});
  const sortedObj=Object.entries(objCount).sort((a,b)=>b[1]-a[1]);

  const cadMes={};
  students.forEach(s=>{if(s.cadastro){const p=s.cadastro.split('/');if(p.length===3){const k=mn[parseInt(p[1])-1]+' '+p[2];cadMes[k]=(cadMes[k]||0)+1;}}});
  const sortedCad=Object.entries(cadMes).sort((a,b)=>{const[ma,ya]=a[0].split(' ');const[mb,yb]=b[0].split(' ');return(yb-ya)||(mn.indexOf(mb)-mn.indexOf(ma));}).slice(0,5);

  const doresCnt={};
  base.forEach(s=>{(s.dores||[]).filter(d=>d!=='Não sinto dores').forEach(d=>{doresCnt[d]=(doresCnt[d]||0)+1;});});
  const sortedDores=Object.entries(doresCnt).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const filtroLabel=selMes?mesesDisp.find(m=>m.value===selMes)?.label||selMes:'Todos os meses';

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px">

      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <label style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:1px">Filtrar por mês:</label>

          <option value="">Todos os meses</option>
          ${mesesDisp.map(m=>`<option value="${m.value}"${selMes===m.value?' selected':''}>${m.label}</option>`).join('')}
        </select>
        ${selMes?`<button onclick="document.getElementById('dashMesSel').value='';renderDash()" style="font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer">✕ Limpar</button>`:''}
      </div>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-val">${total}</div><div class="kpi-lbl">${selMes?'Alunos no mês':'Total de Alunos'}</div></div>
      <div class="kpi-card"><div class="kpi-val" style="color:var(--accent2)">${feitos}</div><div class="kpi-lbl">Treinos Feitos</div></div>

      <div class="dash-card">

      <div class="dash-card">

            <span class="metric-label">${m}</span>

            <span class="metric-value">${n}</span>
          </div>`).join('')}
      </div>
      <div class="dash-card">
        <h3>🎯 Objetivos mais Comuns</h3>
        ${sortedObj.length?sortedObj.map(([o,n])=>`
          <div class="metric-row">
            <span class="metric-label" style="font-size:13px">${o}</span>
            <span class="metric-value">${n}</span>
          </div>`).join(''):'<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px">Sem dados</div>'}
      </div>
      <div class="dash-card">
        <h3>🦴 Dores mais Relatadas</h3>
        ${sortedDores.length?sortedDores.map(([d,n])=>`
          <div class="metric-row">
            <span class="metric-label">${d}</span>
            <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(n/Math.max(...sortedDores.map(x=>x[1]),1)*100)}%;background:var(--danger)"></div></div>
            <span class="metric-value red">${n}</span>
          </div>`).join(''):'<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px">Sem dados</div>'}
      </div>
    </div>`;
}

// Auto-refresh
setInterval(()=>{if(document.getElementById('tab-recados').classList.contains('active'))renderRecados();if(document.getElementById('tab-links').classList.contains('active'))renderLinks();},20000);
checkAuth();
</script>
</body>
</html>
